<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b6e4f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0b6e4f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer Energy Efficiency Rings -->
  <circle cx="300" cy="200" r="160" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8,8" opacity="0.3"/>
  <circle cx="300" cy="200" r="130" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="16,8" opacity="0.4"/>
  <circle cx="300" cy="200" r="100" fill="url(#sunGlow)"/>

  <!-- Futuristic Aerogel Core Shield -->
  <polygon points="300,100 380,150 380,250 300,300 220,250 220,150" fill="url(#coreGlow)" filter="drop-shadow(0 12px 24px rgba(11,110,79,0.35))"/>
  
  <!-- Inner R-Value Gauge / Rocket Icon -->
  <g transform="translate(300, 200)">
    <!-- Insulated Energy Star Symbol -->
    <circle cx="0" cy="0" r="42" fill="#ffffff" opacity="0.15"/>
    <path d="M-15,-20 L0,-40 L15,-20 L25,-25 L18,-5 L35,5 L18,12 L22,30 L5,20 L-5,35 L-12,18 L-30,22 L-20,5 L-35,-5 L-18,-12 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="0" cy="0" r="14" fill="#f59e0b"/>
  </g>

  <!-- High-Tech Insulation Specs Floating -->
  <g transform="translate(80, 160)">
    <rect width="110" height="38" rx="8" fill="#ffffff" opacity="0.9" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
    <text x="55" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#0b6e4f" text-anchor="middle">R-60+ RATED</text>
  </g>

  <g transform="translate(410, 160)">
    <rect width="110" height="38" rx="8" fill="#ffffff" opacity="0.9" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
    <text x="55" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#0284c7" text-anchor="middle">AEROGEL TECH</text>
  </g>

  <g transform="translate(225, 330)">
    <rect width="150" height="32" rx="16" fill="#0f172a" opacity="0.8"/>
    <text x="75" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#34d399" text-anchor="middle">NEXT-GEN ENVELOPE</text>
  </g>
</svg>
